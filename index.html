<!DOCTYPE html>
<html lang="pt-br">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Consulta de Materiais</title>

<style>

body{
    font-family:Segoe UI, Arial;
    background:#f3f2f1;
    padding:20px;
}

.container{
    max-width:1400px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.2);
}

h1{
    color:#0078d4;
}

input,select,button{
    padding:10px;
    margin:5px;
}

button{
    background:#0078d4;
    color:white;
    border:none;
    cursor:pointer;
    border-radius:5px;
}

button:hover{
    background:#106ebe;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#0078d4;
    color:white;
}

td,th{
    border:1px solid #ddd;
    padding:8px;
    text-align:left;
}

.total{
    margin-top:20px;
    font-weight:bold;
    font-size:18px;
}

</style>

</head>

<body>

<div class="container">

<h1>CONSULTA DE RETIRADAS</h1>

<select id="supervisor">
    <option>ALCIONE CACHUK</option>
    <option>JOSE</option>
    <option>MARCOS</option>
    <option>RICARDO</option>
</select>

<button onclick="consultar()">
    Consultar
</button>

<button onclick="exportarCSV()">
    Exportar Excel
</button>

<div class="total" id="totalItens">
    Total de itens: 0
</div>

<table>

<thead>
<tr>
    <th>Retirada</th>
    <th>Supervisor</th>
    <th>Serial</th>
    <th>Data</th>
    <th>Quantidade</th>
    <th>Tipo</th>
</tr>
</thead>

<tbody id="resultado">
</tbody>

</table>

<h2>Resumo por Material</h2>

<table>

<thead>
<tr>
    <th>Material</th>
    <th>Quantidade</th>
</tr>
</thead>

<tbody id="resumo">
</tbody>

</table>

</div>

<script>

const URL_FLOW =
"https://default9744600e3e04492ebaa125ec245c6f.10.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/d15068f198214a769c5dbf9806208002/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=nWb1Rr_Uig8NSMngTReCC3EVRHTY2QJZN6F35k6_X3A";




let dadosRetornados = [];

async function consultar(){

    try{

        const supervisor =
        document.getElementById("supervisor").value;

        const dados = {
            supervisor: supervisor
        };

        const resposta = await fetch(URL_FLOW,{
            method:"POST",
            headers:{
                "Content-Type":"application/json"
            },
            body:JSON.stringify(dados)
        });

        const retorno = await resposta.json();

        dadosRetornados = retorno;

        montarTabela(retorno);

    }
    catch(erro){

        console.error(erro);

        alert(
            "Erro ao consultar dados. Verifique o fluxo."
        );

    }

}

function montarTabela(dados){

    const tbody =
    document.getElementById("resultado");

    const resumoBody =
    document.getElementById("resumo");

    tbody.innerHTML = "";
    resumoBody.innerHTML = "";

    let total = 0;

    let resumoMateriais = {};

    dados.forEach(item => {

        total++;

        tbody.innerHTML += `
        <tr>
            <td>${item.Title || ''}</td>
            <td>${item.SUPERVISOR || ''}</td>
            <td>${item.SERIAL || ''}</td>
            <td>${item.DATA || ''}</td>
            <td>${item.QUANTIDADE || ''}</td>
            <td>${item.TIPO || ''}</td>
        </tr>
        `;

        let qtd =
        parseInt(item.QUANTIDADE || 0);

        let material =
        item.TIPO || "SEM DESCRIÇÃO";

        resumoMateriais[material] =
        (resumoMateriais[material] || 0) + qtd;

    });

    document.getElementById("totalItens").innerText =
    "Total de itens: " + total;

    for(const material in resumoMateriais){

        resumoBody.innerHTML += `
        <tr>
            <td>${material}</td>
            <td>${resumoMateriais[material]}</td>
        </tr>
        `;

    }

}

function exportarCSV(){

    if(dadosRetornados.length === 0){

        alert("Nenhum dado para exportar.");

        return;
    }

    let csv =
    "Retirada;Supervisor;Serial;Data;Quantidade;Tipo\n";

    dadosRetornados.forEach(item => {

        csv +=
        `${item.Title || ''};` +
        `${item.SUPERVISOR || ''};` +
        `${item.SERIAL || ''};` +
        `${item.DATA || ''};` +
        `${item.QUANTIDADE || ''};` +
        `${item.TIPO || ''}\n`;

    });

    const blob = new Blob(
        ["\ufeff" + csv],
        {
            type:"text/csv;charset=utf-8;"
        }
    );

    const link =
    document.createElement("a");

    link.href =
    URL.createObjectURL(blob);

    link.download =
    "Consulta_Materiais.csv";

    document.body.appendChild(link);

    link.click();

    document.body.removeChild(link);

}

</script>

</body>
</html>
