<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Retirada de Materiais</title>

<style>

body{
    font-family:Segoe UI,Arial;
    background:#f3f2f1;
    padding:20px;
}

.container{
    max-width:1200px;
    margin:auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,.2);
}

h1{
    color:#0078d4;
}

label{
    display:block;
    margin-top:10px;
    font-weight:bold;
}

input,select{
    width:100%;
    padding:10px;
    margin-top:5px;
    box-sizing:border-box;
}

button{
    background:#0078d4;
    color:white;
    border:none;
    padding:10px 15px;
    margin-top:15px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#0078d4;
    color:white;
}

td,th{
    border:1px solid #ddd;
    padding:8px;
}

.hidden{
    display:none;
}

</style>

</head>

<body>

<div class="container">

<h1>CONTROLE DE MATERIAIS</h1>

<h3 id="lblProtocolo"></h3>

<label>Supervisor</label>

<select id="supervisor">
     <option>BIAFRA MIGUEL CARNEIRO</option>
     <option>BRUNO SANTOS</option>
     <option>CLEITON MASSULINI TAMBORI</option>
     <option>CLEVERSON HENRIQUE LOTH</option>
     <option>EDISON LIMA</option>
     <option>ELTON DE MORAIS</option>
     <option>ERICK WILLIAN PRADO WASCH</option>
     <option>FRANCISCO LAVOISIER QUEIROZ BARBOSA</option>
     <option>GLAUBER DOS SANTOS ROCHA</option>
     <option>JEFERSON SILVA DE OLIVEIRA</option>
     <option>LEANDRO MICHEL RIBEIRO</option>
     <option>LUCIO FRANCISCO DOS SANTOS</option>
     <option>MARCIO ROBERTO CHEMPCIK</option>
     <option>MARCOS ROBERTO STURIAO</option>
     <option>MARCOS VINICIUS XAVIER NEVES</option>
     <option>RENE IVO KUK</option>
     <option>RICARDO FREITAS TABORDA</option>
     <option>ROBERTO CARLOS GODIM SCHASKO</option>
     <option>ROBINSON PEREIRA DE OLIVEIRA</option>
     <option>RODRIGO BREZINA BONIKOSKI</option>
     <option>SAMUEL ARENT</option>
     <option>SANDOKAN RIGONI DORIGON</option>
     <option>TRANSFERENCIA RS</option>
     <option>WILIAM MARCA</option>
</select>

<label>Categoria</label>

<select id="categoria" onchange="alterarCategoria()">

    <option value="">Selecione</option>
    <option value="CPE">CPE</option>
    <option value="MISCELANEA">MISCELANEA</option>

</select>

<div id="blocoCPE" class="hidden">

    <label>Tipo</label>

    <select id="tipoCPE">

        <option>HGU</option>
        <option>ONU</option>
        <option>ATA</option>

    </select>

    <label>Serial</label>

    <input
        type="text"
        id="serial"
        placeholder="Bipe ou digite o serial">

</div>

<div id="blocoMIS" class="hidden">

    <label>Tipo</label>

    <select id="tipoMIS">

        <option>CONECTOR</option>
        <option>FIBRA 500M</option>
        <option>FIBRA 100M</option>

    </select>

    <label>Quantidade</label>

    <input
        type="number"
        id="quantidade"
        value="1"
        min="1">

</div>

<button onclick="adicionarItem()">
Adicionar Item
</button>

<table>

<thead>

<tr>
    <th>PROTOCOLO</th>
    <th>SUPERVISOR</th>
    <th>SERIAL</th>
    <th>DATA</th>
    <th>TIPO</th>
    <th>QTD</th>
    <th>AÇÃO</th>
</tr>

</thead>

<tbody id="tabelaItens"></tbody>

</table>

<button onclick="enviarLote()">
Finalizar Retirada
</button>

<div id="mensagem"></div>

</div>

<script>

const URL_FLOW =
"https://default9744600e3e04492ebaa125ec245c6f.10.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/a54eabefd9af40c1a7ca1c2eaa7ae874/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=qSL_xYD9vcjOzVfiFqPKEG_fV7WjzoYTUOEXDeny89k";

let itens = [];

const protocolo =
"RET-" +
new Date().toISOString().slice(0,10).replace(/-/g,"") +
"-" +
Date.now();

document.getElementById("lblProtocolo").innerHTML =
"PROTOCOLO: " + protocolo;

function alterarCategoria(){

    document.getElementById("blocoCPE")
    .classList.add("hidden");

    document.getElementById("blocoMIS")
    .classList.add("hidden");

    const categoria =
    document.getElementById("categoria").value;

    if(categoria === "CPE"){

        document.getElementById("blocoCPE")
        .classList.remove("hidden");

    }

    if(categoria === "MISCELANEA"){

        document.getElementById("blocoMIS")
        .classList.remove("hidden");

    }

}

function adicionarItem(){

    const supervisor =
    document.getElementById("supervisor").value;

    const data =
    new Date().toISOString().split('T')[0];

    const categoria =
    document.getElementById("categoria").value;

    let item;

    if(categoria === "CPE"){

        const tipo =
        document.getElementById("tipoCPE").value;

        const serial =
        document.getElementById("serial").value;

        if(serial === ""){
            alert("Informe o serial");
            return;
        }

        item = {

            title: protocolo,
            supervisor: supervisor,
            serial: serial,
            data: data,
            quantidade: "1",
            tipo: tipo

        };

        document.getElementById("serial").value="";

    }
        if(categoria === "MISCELANEA"){

        const tipo =
        document.getElementById("tipoMIS").value;

        const quantidade =
        document.getElementById("quantidade").value;

        item = {

            title: protocolo,
            supervisor: supervisor,
            serial: tipo,
            data: data,
            quantidade: quantidade.toString(),
            tipo: tipo

        };

    }

    itens.push(item);

    atualizarTabela();

}

function atualizarTabela(){

    let tbody =
    document.getElementById("tabelaItens");

    tbody.innerHTML = "";

    itens.forEach((item,index)=>{

        tbody.innerHTML += `
        <tr>
            <td>${item.title}</td>
            <td>${item.supervisor}</td>
            <td>${item.serial}</td>
            <td>${item.data}</td>
            <td>${item.tipo}</td>
            <td>${item.quantidade}</td>
            <td>
                <button onclick="removerItem(${index})">
                    Excluir
                </button>
            </td>
        </tr>
        `;

    });

}

function removerItem(index){

    itens.splice(index,1);

    atualizarTabela();

}

async function enviarLote(){

    if(itens.length === 0){

        alert("Nenhum item adicionado.");
        return;

    }

    try{

        for(const item of itens){

            const dados = {

                title: item.title,
                supervisor: item.supervisor,
                serial: item.serial,
                data: item.data,
                quantidade: item.quantidade,
                tipo: item.tipo

            };

            console.log("ENVIANDO:");
            console.log(JSON.stringify(dados,null,2));

            const resposta = await fetch(URL_FLOW,{

                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify(dados)

            });

            const retorno =
            await resposta.json();

            console.log("RETORNO:");
            console.log(retorno);
        alert("✅ Retirada enviada com sucesso!");
           
        }

        document.getElementById("mensagem").innerHTML = "✅ Retirada enviada com sucesso!";
       
        itens = [];

        atualizarTabela();
        location.reload();
    }
    catch(erro){

        console.error(erro);

        document.getElementById("mensagem").innerHTML =
        "❌ Erro ao enviar retirada";

    }

}

</script>

</body>
</html>
